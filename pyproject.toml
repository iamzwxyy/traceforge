[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "traceforge-agent"
version = "0.1.0"
description = "A local coding agent that proves its work."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "TraceForge contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.60,<3",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "regex>=2025.7,<2027",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-regex>=2025.7,<2027",
]

[project.scripts]
traceforge = "traceforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/traceforge"]
artifacts = ["src/traceforge/static/**"]

[tool.hatch.build.targets.wheel.force-include]
"demo/tenant-cache-api" = "traceforge/demo_workspace"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["traceforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["traceforge"]
