name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Ubuntu backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --all-extras

      - name: Python quality
        run: |
          uv run ruff check src tests scripts
          uv run mypy src
          uv run pytest --cov=traceforge --cov-report=term -q
          uv run python scripts/check_secrets.py

      - name: Build distribution
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traceforge-dist
          path: dist/*

  web-quality:
    name: Ubuntu web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Install locked web and demo dependencies
        run: |
          uv sync --locked --all-extras
          pnpm install --frozen-lockfile
          pnpm --filter traceforge-web exec playwright install --with-deps chromium

      - name: Web quality
        run: |
          pnpm --filter traceforge-web lint
          pnpm --filter traceforge-web typecheck
          pnpm --filter traceforge-web test --run
          pnpm --filter traceforge-web build
          pnpm --filter traceforge-web e2e

  macos-smoke:
    name: macOS smoke
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install and smoke test
        run: |
          uv sync --locked --all-extras
          uv run traceforge --help
          uv run pytest -q tests/test_demo.py tests/test_workspace.py
          uv build
